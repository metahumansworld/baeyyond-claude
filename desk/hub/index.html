<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0B0B0E">
<title>Waiting on you</title>
<style>
  /* The baeYYond sheet's own faces and colours, so the hub reads as part of it. */
  @font-face { font-family: "Bricolage"; src: url("fonts/bricolage-latin.woff2") format("woff2"); font-weight: 200 800; font-display: swap; }
  @font-face { font-family: "YY Mono"; src: url("fonts/YYMono-Regular.otf") format("opentype"); font-weight: 400; font-display: swap; }

  :root {
    --charcoal: #0B0B0E; --gesso: #F2EEE6; --ultra: #2533D6;
    --gesso-80: rgba(242, 238, 230, .80); --gesso-64: rgba(242, 238, 230, .64);
    /* The sheet's faint step is .40, which reads 3.4 to 1 on a card; .52 is the lightest that clears 4.5 to 1. */
    --gesso-52: rgba(242, 238, 230, .52);
    --font-display: "Bricolage", system-ui, sans-serif;
    --font-mono: "YY Mono", ui-monospace, Menlo, monospace;
    --gap: 12px;
  }
  * { box-sizing: border-box; border-radius: 0; }
  html { background: var(--charcoal); color: var(--gesso); }
  body { margin: 0; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.45; padding: env(safe-area-inset-top) 0 calc(24px + env(safe-area-inset-bottom)); }
  button, textarea { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; }
  button, summary { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--gesso-80); outline-offset: 3px; }
  .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .mono { font-family: var(--font-mono); font-size: 11.5px; color: var(--gesso-64); margin: 0; }

  /* The bar: the name, then one line of what waits, with the sheet's blue edge while a session is stopped on you */
  .bar { padding: 14px 16px 4px; }
  .bar h1 { margin: 0; font-family: var(--font-display); font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
  .headline { margin: 10px 0 0; padding: 2px 0; color: var(--gesso-64); }
  .headline.late { box-shadow: inset 2px 0 0 var(--ultra); padding-left: 8px; color: var(--gesso-80); }
  .headline .n { color: var(--gesso); }
  .fresh { margin: 4px 0 0; color: var(--gesso-52); }
  .fresh b { font-weight: 400; color: var(--gesso-64); }

  /* The kind filter, as the sheet's column tabs */
  .kinds { display: flex; flex-wrap: wrap; gap: 0 16px; padding: 4px 16px 0; }
  .kinds button { padding: 10px 0; color: var(--gesso-52); font-family: var(--font-display); font-size: 14px; min-height: 44px; }
  .kinds button .k { font-family: var(--font-mono); font-size: 11px; }
  .kinds button[aria-pressed="true"] { color: var(--gesso); box-shadow: inset 0 -1px 0 var(--ultra); }
  .note { padding: 6px 16px 8px; color: var(--gesso-52); }

  /* A session is a shallow well set into the page; each ask is a card lifted out of it, with the blue light behind */
  main { padding: var(--gap) 16px 16px; }
  .sessions { columns: 1; column-gap: var(--gap); }
  @media (min-width: 600px) { .sessions { columns: 2; } }
  @media (min-width: 1100px) {
    main, .bar, .kinds, .note { max-width: 1240px; margin-left: auto; margin-right: auto; }
    .sessions { columns: auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap); align-items: start; }
    .session { margin: 0; }
  }
  .session {
    break-inside: avoid; display: block; margin: 0 0 var(--gap); padding: 10px 8px 6px;
    background: linear-gradient(180deg, rgba(0, 0, 0, .38), rgba(0, 0, 0, .16));
    box-shadow: inset 0 2px 5px rgba(0, 0, 0, .65), inset 0 -1px 0 rgba(242, 238, 230, .05);
    --lit: .30;
  }
  .session.held { --lit: .66; }
  .session.working { --lit: .42; }
  .session[hidden] { display: none; }
  .s-head { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; margin: 0 2px 12px; }
  .s-name h2 { margin: 0; font-family: var(--font-display); font-size: 13.5px; font-weight: 500; color: var(--gesso-80); }
  .s-name .folder { display: block; margin-top: 2px; font-size: 11px; color: var(--gesso-52); overflow-wrap: anywhere; }
  .s-state { flex: none; text-align: right; font-size: 11px; color: var(--gesso-52); line-height: 1.3; }
  .s-state .mins { display: block; font-family: var(--font-display); font-size: 22px; font-weight: 600; line-height: 1.05; color: var(--gesso); font-variant-numeric: tabular-nums; }
  .session.held .s-state { color: var(--gesso-80); }

  .ask {
    margin: 0 0 14px; padding: 9px 10px 6px;
    background: linear-gradient(180deg, #1d1d20, #161618);
    box-shadow: inset 0 1px 0 rgba(242, 238, 230, .13), 0 1px 0 rgba(0, 0, 0, .7), 0 0 16px 3px rgba(37, 51, 214, var(--lit));
  }
  .session.held .ask:not(.settled) {
    box-shadow: inset 2px 0 0 var(--ultra), inset 0 1px 0 rgba(242, 238, 230, .13), 0 1px 0 rgba(0, 0, 0, .7), 0 0 16px 3px rgba(37, 51, 214, var(--lit));
  }
  .ask[hidden] { display: none; }
  .meta { display: flex; flex-wrap: wrap; gap: 0 10px; margin: 0 0 4px; font-size: 11px; color: var(--gesso-52); }
  .meta .kind { color: var(--gesso-64); }
  .ask h3 { margin: 0 0 5px; font-family: var(--font-mono); font-size: 1em; font-weight: 400; color: var(--gesso); overflow-wrap: anywhere; }
  .detail { margin: 0 0 6px; color: var(--gesso-80); overflow-wrap: anywhere; }

  /* A review's link: the sheet's underlined word */
  .look { display: flex; align-items: center; gap: 10px; min-height: 44px; color: var(--gesso); text-decoration: none; }
  .look span.w { box-shadow: inset 0 -1px 0 var(--ultra); padding: 2px 0; }
  .look .where { color: var(--gesso-52); font-size: 11px; }
  .look::after { content: "\2197"; margin-left: auto; color: var(--gesso-64); }

  /* Answers: recessed rows; the session's own suggestion is filled, as the sheet fills the act that finishes */
  .answers { display: grid; gap: 6px; margin: 4px 0 2px; }
  .answers.two { grid-template-columns: 1fr 1fr; }
  .opt {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    min-height: 44px; padding: 8px 12px; text-align: left; color: var(--gesso);
    background: rgba(0, 0, 0, .35); box-shadow: inset 0 1px 3px rgba(0, 0, 0, .7);
  }
  .opt:hover { box-shadow: inset 0 0 0 1px var(--gesso-64); }
  .opt.pick { background: var(--ultra); box-shadow: none; }
  .opt.pick:hover { box-shadow: inset 0 0 0 1px var(--gesso-64); }
  .opt .sug { font-size: 11px; color: var(--gesso-80); }
  .answers.two .opt { flex-direction: column; justify-content: center; gap: 0; text-align: center; }

  /* The plain-word acts at the card's foot */
  .acts { display: flex; flex-wrap: wrap; align-items: center; gap: 0 14px; margin: 2px 0 0; }
  .acts .done { margin-left: auto; }
  .acts .write[open] { flex: 1 0 100%; }
  .write summary, .done, .answered summary {
    list-style: none; display: inline-flex; align-items: center; min-height: 40px;
    font-size: 11.5px; color: var(--gesso-64);
  }
  .write summary::-webkit-details-marker, .answered summary::-webkit-details-marker { display: none; }
  .write summary:hover, .done:hover, .answered summary:hover { color: var(--gesso); }
  .write[open] summary { color: var(--gesso); }
  .reply { display: flex; gap: 8px; align-items: stretch; margin: 6px 0 4px; }
  .reply textarea {
    flex: 1; min-width: 0; min-height: 44px; max-height: 40vh; resize: vertical; padding: 8px 10px;
    color: var(--gesso); background: rgba(0, 0, 0, .35); box-shadow: inset 0 1px 3px rgba(0, 0, 0, .7); line-height: 1.45;
  }
  .reply textarea::placeholder { color: var(--gesso-52); opacity: 1; }
  .send { flex: none; min-height: 44px; padding: 0 14px; background: var(--ultra); color: var(--gesso); }
  .send:hover { box-shadow: inset 0 0 0 1px var(--gesso-64); }
  .waits { margin: 2px 0 0; color: var(--gesso-64); font-size: 11.5px; }

  /* After an answer: your words, then where they got to */
  .said { margin: 2px 0 0; color: var(--gesso); }
  .said q { quotes: "\201C" "\201D"; }
  .trail { margin: 2px 0 6px; font-size: 11px; color: var(--gesso-52); }
  .trail .took { color: var(--gesso-80); }
  .settled h3 { color: var(--gesso-64); }
  .settled .detail { display: none; }
  .appear { animation: appear 200ms cubic-bezier(0.23, 1, 0.32, 1) both; }
  @keyframes appear { from { opacity: 0; transform: translateY(4px); } }
  .answered { margin: 0 2px 8px; }

  /* The session's sites, at the foot of its well */
  .sites { margin: 0 2px; padding: 2px 0 2px; }
  .sites h3 { margin: 0; font-size: 11px; font-weight: 400; color: var(--gesso-52); }
  .sites a { display: flex; align-items: center; gap: 10px; min-height: 40px; color: var(--gesso); text-decoration: none; }
  .sites a .port { box-shadow: inset 0 -1px 0 var(--ultra); padding: 2px 0; }
  .sites a .what { color: var(--gesso-64); }
  .sites a::after { content: "\2197"; margin-left: auto; color: var(--gesso-64); }

  .none { margin: 24px 2px; color: var(--gesso-52); }

  @media (max-width: 520px) {
    body { font-size: 13.5px; }
    main { padding: 10px 10px 16px; }
    .ask { padding: 10px 12px 6px; }
    .meta, .s-state, .s-name .folder, .trail, .sites h3 { font-size: 12px; }
    .write summary, .done, .answered summary, .waits { font-size: 13px; min-height: 44px; }
    .reply textarea { font-size: 16px; }
    .opt .sug { font-size: 12px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .appear { animation: none; }
  }

  /* The live page's own: text as the model wrote it, a file named where it is, and a send that did not go */
  .detail { white-space: pre-line; }
  .look span.w { flex: none; white-space: nowrap; }
  .look .where { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .look-file { margin: 0 0 6px; font-size: 11px; color: var(--gesso-52); overflow-wrap: anywhere; }
  .error { margin: 6px 0 2px; padding: 2px 0 2px 8px; box-shadow: inset 2px 0 0 var(--ultra); color: var(--gesso); }
  .fresh.late { box-shadow: inset 2px 0 0 var(--ultra); padding-left: 8px; color: var(--gesso-80); }
  .note[hidden], .none[hidden] { display: none; }
  @media (max-width: 520px) { .look-file { font-size: 12px; } }
</style>
</head>
<body>
<header class="bar">
  <h1>Waiting on you</h1>
  <p class="mono headline" id="headline">reading the hub…</p>
  <p class="mono fresh" id="fresh" role="status">mac: <b id="fresh-t">not yet answered</b></p>
</header>
<nav class="kinds" aria-label="Show one kind of ask">
  <button type="button" data-kind="all" aria-pressed="true">All <span class="k" data-count="all">0</span></button>
  <button type="button" data-kind="approval" aria-pressed="false">Approvals <span class="k" data-count="approval">0</span></button>
  <button type="button" data-kind="decision" aria-pressed="false">Decisions <span class="k" data-count="decision">0</span></button>
  <button type="button" data-kind="review" aria-pressed="false">Reviews <span class="k" data-count="review">0</span></button>
  <button type="button" data-kind="answer" aria-pressed="false">Answers <span class="k" data-count="answer">0</span></button>
</nav>
<p class="mono note" id="note" hidden></p>

<main>
  <div class="sessions" id="sessions"></div>
  <p class="mono none" id="none" hidden>nothing is waiting on you.</p>
</main>
<script src="app.js"></script>
</body>
</html>
